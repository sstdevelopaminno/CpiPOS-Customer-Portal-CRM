name: Bootstrap dependency lock
on:
  push:
    branches: [refactor/crm-modular-foundation-20261006]
permissions:
  contents: write
jobs:
  lock-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and create lockfile
        run: npm install --no-audit --no-fund
      - name: Validate refactor
        run: npm run check
      - name: Commit package-lock
        shell: bash
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: lock Customer Portal dependencies"
            git push origin HEAD:refactor/crm-modular-foundation-20261006
          fi
